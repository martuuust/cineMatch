# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → conecta este repositorio

services:
  - type: redis
    name: cinematch-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: cinematch-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: REDIS_URL
        fromService:
          name: cinematch-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: cinematch-frontend
          type: web
          property: hostport
      - key: TMDB_API_KEY
        sync: false

  - type: web
    name: cinematch-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BACKEND_UPSTREAM
        fromService:
          name: cinematch-backend
          type: web
          property: hostport
